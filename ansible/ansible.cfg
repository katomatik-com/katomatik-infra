# Project-local Ansible config. Ansible auto-loads this when you run
# playbooks from inside the ansible/ directory, so you don't have to pass
# --inventory or remember flags every time.
[defaults]
inventory = inventory/hosts.ini
# Where to find the 'base' role referenced by site.yml.
roles_path = roles
# Don't create *.retry files on failure (we ignore them in .gitignore anyway).
retry_files_enabled = False
# Show which host each task result belongs to, nicely formatted.
stdout_callback = yaml
# The server is fresh — its SSH host key isn't known yet. For a learning
# lab we auto-accept it on first connect. In production you'd pre-seed
# known_hosts instead (accepting blindly defeats host-key verification).
host_key_checking = False

[privilege_escalation]
# Most base-role tasks need root (installing packages, editing sshd_config).
# 'become' = sudo. We do NOT hardcode a become password here; the first run
# passes it interactively with --ask-become-pass (-K).
become = True
become_method = sudo
