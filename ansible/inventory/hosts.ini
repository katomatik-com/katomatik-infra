# Inventory: the list of machines Ansible manages, grouped by role.
# Right now there's exactly one — the homelab server.
#
# EDIT THESE VALUES:
#   ansible_host = the server's current IP (DHCP for now — check with
#                  `ip addr` on the server). Update when it changes, or
#                  after you set the static reservation to 192.168.2.10.
#   ansible_user = the sudo user you created during the Asahi install.

[homelab]
server ansible_host=192.168.2.42 ansible_user=katomatik

[homelab:vars]
# Fedora Asahi ships Python 3 at the system path; be explicit so Ansible
# doesn't have to guess which interpreter to use on the target.
ansible_python_interpreter=/usr/bin/python3
