---
# Handlers are tasks that run only when 'notified' by another task, and only
# ONCE at the end of the play — no matter how many tasks notified them. This
# is why we edit two sshd_config lines but restart sshd a single time.

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: restart logind
  ansible.builtin.systemd:
    name: systemd-logind
    state: restarted

# Reload (not restart) so NetworkManager re-reads conf.d without bouncing the
# live WiFi link that Ansible is connected over. The powersave default takes
# effect on the next connection activation / reboot.
- name: reload NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded
