---
# base role — OS-level setup and hardening for the homelab server.
#
# ORDERING MATTERS. Tasks run top-to-bottom. The SSH key is deployed BEFORE
# password authentication is disabled, so by the time logins are key-only the
# key is already in place. Your current session also stays connected across
# the sshd restart. Still: on the very FIRST run, connect with a password
# (--ask-pass) and DON'T flip ssh_password_authentication to "no" until you've
# confirmed key login works. See README / CLAUDE.md.

# --- 1. System update (the note in CLAUDE.md: do this first) ---
- name: Upgrade all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true

# --- 2. Base packages ---
- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present

# --- 3. Hostname ---
- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"

# --- 4. Time sync & timezone ---
# Correct, synchronized time is a quiet dependency of almost everything:
# TLS cert validity, k3s/etcd, log correlation, and token expiry all break
# under clock drift. chrony is Fedora's default NTP client.
- name: Set the system timezone
  community.general.timezone:
    name: "{{ server_timezone }}"

- name: Ensure chrony is installed
  ansible.builtin.dnf:
    name: chrony
    state: present

- name: Ensure chrony (NTP) is running and enabled at boot
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true

# --- 5. Deploy the SSH public key (BEFORE any SSH hardening) ---
- name: Ensure .ssh dir + install authorized public key
  ansible.posix.authorized_key:
    user: "{{ ssh_user }}"
    state: present
    key: "{{ lookup('file', ssh_public_key_file) }}"

# --- 6. SSH hardening ---
# Edit sshd_config in place. Each task notifies the 'restart sshd' handler,
# which runs ONCE at the end of the play (not after every line).
- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PermitRootLogin'
    line: "PermitRootLogin {{ ssh_permit_root_login }}"
    validate: /usr/sbin/sshd -t -f %s   # refuse to save a broken config
  notify: restart sshd

- name: Disable SSH password authentication (key-only login)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PasswordAuthentication'
    line: "PasswordAuthentication {{ ssh_password_authentication }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd

# --- 7. Prevent sleep/suspend (CRITICAL for a headless laptop server) ---
# Two independent things can put a laptop to sleep:
#   (a) the systemd sleep targets, and
#   (b) the lid switch (this is a MacBook — the lid will be shut).
- name: Mask systemd sleep/suspend/hibernate targets
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

- name: Ensure the logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    mode: "0755"

- name: Ignore the lid switch so a closed lid doesn't suspend the server
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/99-homelab-nosleep.conf
    content: |
      # Managed by Ansible (base role). Headless laptop server: never sleep.
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
    mode: "0644"
  notify: restart logind

# --- 8. Firewall basics (firewalld) ---
- name: Ensure firewalld is installed
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Ensure firewalld is running and enabled at boot
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Allow SSH through the firewall
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    immediate: true
    state: enabled

# --- 9. Automatic updates ---
# Fedora uses dnf5, whose automatic plugin reads
# /etc/dnf/dnf5-plugins/automatic.conf. The package ships that path as an rpm
# "ghost" (owned but not written to disk), so we seed it from the shipped
# default template, then set our values. The real timer unit is
# dnf5-automatic.timer (dnf-automatic.timer is just an alias to it).
- name: Seed the dnf5-automatic config from the shipped default
  ansible.builtin.copy:
    src: /usr/share/dnf5/dnf5-plugins/automatic.conf
    dest: /etc/dnf/dnf5-plugins/automatic.conf
    remote_src: true       # src is a file ON THE HOST, not the control node
    force: false           # don't clobber it once it exists (idempotent seed)
    owner: root
    group: root
    mode: "0644"

- name: Set dnf5-automatic to apply security updates automatically
  community.general.ini_file:
    path: /etc/dnf/dnf5-plugins/automatic.conf
    section: commands
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - { option: upgrade_type, value: "{{ dnf_automatic_upgrade_type }}" }
    - { option: apply_updates, value: "{{ dnf_automatic_apply_updates }}" }

- name: Enable and start the dnf5-automatic timer
  ansible.builtin.systemd:
    name: dnf5-automatic.timer
    state: started
    enabled: true
