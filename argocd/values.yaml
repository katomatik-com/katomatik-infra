# ArgoCD Helm chart values — bootstrap config for the homelab (single node).
#
# Chart: argo/argo-cd, pinned to 10.1.3 (see apps/argocd.yaml and the bootstrap
# command in docs/adr/0003). This same file is used TWICE, so it's the single
# source of truth for ArgoCD's own config:
#   1. the one-time bootstrap:  helm install ... -f argocd/values.yaml
#   2. ArgoCD self-managing itself afterwards (apps/argocd.yaml references it)
#
# Kept intentionally minimal — add config here as needs arise, committed to Git.

global:
  domain: argocd.katomatik.com

configs:
  params:
    # Run argocd-server WITHOUT its own TLS (Traefik/Cloudflare terminate it).
    server.insecure: true
  cm:
    # KSOPS: let kustomize run the ksops exec plugin (ADR-0012).
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

server:
  ingress:
    enabled: true
    ingressClassName: traefik

# KSOPS in the repo-server (ADR-0012, docs/guides/argocd-secret-decryption.md):
# an init container installs ksops + kustomize into a shared volume that overrides
# the built-in kustomize; the cluster age key (the sops-age Secret) is mounted so
# sops can decrypt SOPS'd manifests at render time.
repoServer:
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /.config/sops/age
      name: sops-age
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
    - name: XDG_CONFIG_HOME
      value: /.config
