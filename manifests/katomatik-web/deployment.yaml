# The workload: the static site, served from its container image.
#
# No `namespace:` here on purpose — the ArgoCD Application (apps/katomatik-web.yaml)
# sets destination.namespace, so these manifests stay namespace-portable and the
# name lives in exactly one place.
#
# The image tag is a git commit hash (dfe8989), NOT a floating tag like :latest.
# GitOps wants an immutable, committed reference so "what's deployed" always maps
# to a line in Git. Shipping a new build = bump this tag and push (see the how-to
# in docs/guides/add-an-app.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: katomatik-web
  labels:
    app.kubernetes.io/name: katomatik-web
spec:
  replicas: 1               # single-node lab; one static-site pod is plenty
  selector:
    matchLabels:
      app.kubernetes.io/name: katomatik-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: katomatik-web
    spec:
      containers:
        - name: web
          image: ghcr.io/katomatik-com/katomatik-web:be6ef2d
          ports:
            - name: http    # named port — the Service targets this name, not 8080
              containerPort: 8080
          # A static site has no real "health" beyond "is the server answering",
          # so both probes just GET / on the container port.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # Requests reserve a floor; the memory limit caps it. No CPU limit on
          # purpose (CPU is compressible — throttling beats OOM-killing here).
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
