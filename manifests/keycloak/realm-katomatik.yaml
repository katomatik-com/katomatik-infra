# The `katomatik` realm — the identity domain for katomatik's apps and users,
# declared as a KeycloakRealmImport CR (GitOps; ADR-0014). ONE realm for now
# (single admin + small user base — ADR-0008's "no premature machinery"); split
# out a separate internal realm later only if a distinct security domain appears.
# Self-registration is off (Keycloak default). Clients (ArgoCD, the Spring app)
# are added separately as KeycloakOIDCClient CRs.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: katomatik
spec:
  keycloakCRName: keycloak
  realm:
    realm: katomatik
    enabled: true
    clients:
      # ArgoCD UI — PUBLIC client + PKCE (no client secret). Phase 1: gate ArgoCD.
      - clientId: argocd
        name: ArgoCD
        enabled: true
        publicClient: true            # no secret; PKCE instead
        standardFlowEnabled: true     # authorization-code flow (browser login)
        directAccessGrantsEnabled: false
        redirectUris:
          - https://argocd.katomatik.com/auth/callback
          - http://localhost:8085/auth/callback   # argocd CLI
        webOrigins:
          - https://argocd.katomatik.com
        attributes:
          pkce.code.challenge.method: S256        # enforce PKCE (S256)
