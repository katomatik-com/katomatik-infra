# Canonical-host redirect: www.kurtcebe.nl -> kurtcebe.nl (301).
#
# Same choice as katomatik.com: serve one canonical hostname rather than the
# same page on two, and keep the redirect in the cluster (Traefik) rather than
# as a Cloudflare edge rule — per-hostname routing lives behind Traefik and the
# Cloudflare/Terraform layer stays thin (ADR-0002).
#
# Two objects:
#   1. A Middleware that rewrites any www URL to the apex over https.
#   2. An Ingress for www that attaches that Middleware. Traefik runs the
#      middleware BEFORE the backend, so www traffic is redirected and never
#      really reaches the pod — but a backend is still required syntactically.

apiVersion: traefik.io/v1alpha1     # Traefik v3 (bundled with k3s v1.36)
kind: Middleware
metadata:
  name: www-to-apex
  labels:
    app.kubernetes.io/name: kurtcebenl-web
spec:
  redirectRegex:
    # Traefik sees plain http here (TLS was terminated at Cloudflare), so match
    # http OR https and always send the browser to the https apex. ${1} is the
    # captured path, so deep links (/foo/bar) survive the redirect.
    regex: "^https?://www\\.kurtcebe\\.nl/(.*)"
    replacement: "https://kurtcebe.nl/${1}"
    permanent: true                 # 301, not a temporary 302
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kurtcebenl-web-www
  labels:
    app.kubernetes.io/name: kurtcebenl-web
  annotations:
    # Attach the Middleware above. Format is <namespace>-<name>@kubernetescrd;
    # the namespace (kurtcebenl-web) is set by the Application's destination.
    # A stale namespace prefix here is the classic silent failure: Traefik never
    # resolves the middleware and www serves the site instead of redirecting.
    traefik.ingress.kubernetes.io/router.middlewares: kurtcebenl-web-www-to-apex@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: www.kurtcebe.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:               # required, but never served — the redirect fires first
              service:
                name: kurtcebenl-web
                port:
                  number: 80
